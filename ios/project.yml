# XcodeGen spec. Generate the Xcode project with:
#   python3 scripts/prepare_branding.py && xcodegen generate
name: OrderNotifier
options:
  bundleIdPrefix: app.ordernotifier
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "2.0"
    CURRENT_PROJECT_VERSION: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
targets:
  OrderNotifier:
    type: application
    platform: iOS
    sources:
      - path: OrderNotifier
    settings:
      base:
        # Sideloadly re-signs the app with your Apple ID and can change this if it's taken.
        PRODUCT_BUNDLE_IDENTIFIER: app.ordernotifier.store.k7q2
        PRODUCT_NAME: OrderNotifier
        TARGETED_DEVICE_FAMILY: "1"  # iPhone only
        INFOPLIST_FILE: Support/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_STRICT_CONCURRENCY: minimal
        ENABLE_PREVIEWS: YES
    scheme:
      testTargets:
        - OrderNotifierUITests
  OrderNotifierUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: OrderNotifierUITests
    dependencies:
      - target: OrderNotifier
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.ordernotifier.store.k7q2.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: OrderNotifier
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_STRICT_CONCURRENCY: minimal
